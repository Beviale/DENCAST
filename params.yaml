# Anomaly detection with no target column.
#
# The regression task is gone. DENCAST's clustering is kept, but what it feeds
# is no longer a similarity-weighted prediction: an object is scored by how far
# each of its columns sits from its own cluster's mean, in that cluster's own
# standard deviations. There is nothing to predict, so there is no residual, no
# calibration curve and no `g`.
#
# Why the change. The residual score watched one column and was blind to the
# other sixteen: perturb a feature and no error appears, the object is simply
# routed elsewhere and looks ordinary there. Measured on injected faults the
# two approaches turned out complementary rather than competing -- on anomalies
# spread thinly across six columns the residual reached AUC-PR 0.0073 against
# this formulation's 0.156, and on single-column target faults the ordering
# reversed. This file configures the second one.
#
# The regression configuration is preserved in params_regression.yaml, which is
# what the diagnostic scripts under scripts/ still read.

dataset:
  name: pv_italy_spread
  source: data/external/pv_italy_spread.csv
  table: null
  id_col: id
  date_col: data
  group_col: idsito

  # One list, no target singled out. Every column is scored against the
  # cluster, and the vector the clustering itself is built on is all of them.
  columns:
    - idsito
    - lat
    - lon
    - day
    - ora
    - temperatura_ambiente
    - irradiamento
    - altitude
    - azimuth
    - pressure
    - windspeed
    - humidity
    - icon
    - dewpoint
    - windbearing
    - cloudcover
    - kwh

  cyclical_cols: {}
  anomaly_col: anomaly
  subsample_minutes: null

  # The dump is already min-max normalized -- note the `_norm` suffix on the
  # original table names.
  scale_features: false

lsh:
  # r is the number of hyperplanes, so there are only 2^r possible signatures,
  # and that has to suit the size of the set being hashed. The original
  # config.properties ships lsh.dimensions=3, which was tuned for thirty-day
  # windows of some eight thousand objects; without the rolling window the fit
  # sees 162,000, and eight buckets of twenty thousand is no locality at all --
  # the sort stops separating anything and the sliding window picks essentially
  # at random. Permuting three bits also yields at most six distinct orderings,
  # so thirty permutations buy six views rather than thirty.
  #
  # r=11 is the paper's own Table 1 value: 2048 buckets, about eighty objects
  # each at this scale, where a window of thirty means something.
  r: 11
  num_permutations: 30
  b: 30
  min_sim: 0.95
  # No targets to leave out any more: `columns` puts everything in the vector,
  # so this is true of the data rather than of a choice.
  use_targets_in_signature: true

clustering:
  min_pts: 10
  label_change_rate: 0.05
  max_iterations: 100

split:
  # Train fits, valid chooses the winner, test is read once. 60/20/20.
  train_fraction: 0.6
  valid_fraction: 0.2

scoring:
  # sigmoid((mean_z2 - offset) / scale), where mean_z2 is the mean over columns
  # of ((x - mu_cluster) / sigma_cluster)^2.
  #
  # offset and scale are not cosmetic. A sigmoid is monotonic, so it cannot
  # change a ranking on its own -- sigmoid(S) orders objects exactly as S does.
  # What it can do is destroy one: S runs to the tens across seventeen columns
  # and float64 cannot tell sigmoid(36) from sigmoid(200), so fed raw every
  # object ties at 1.0 and the ranking goes flat. Dividing by the column count
  # and centring here keeps the argument where the sigmoid still resolves.
  #
  # offset 1.0 puts the midpoint at "one standard deviation out in a typical
  # column", which is roughly where an ordinary cluster member sits.
  offset: 1.0
  scale: 1.0

  # Pulls each cluster's per-column variance toward the global one. A cluster of
  # six members estimates a variance from six numbers, and dividing by a
  # spuriously small one manufactures anomalies.
  #
  # 100, measured, not assumed. At 2.0 against clusters of ~108 members the
  # weight on a cluster's own variance is 108/110 -- the prior did nothing. The
  # grid over [2, 25, 100] lifted the best formula from 0.0238 to 0.0267 and
  # moved the top-100 count from 5 to 6, and it also reversed the ordering of the
  # aggregations: at 2.0 the maximum beat top-3 and top-5, at 100 the order is
  # top5 > top3 > top1. That is the expected signature of a noisy scale estimate
  # -- widening the aggregation accumulates noise when sigma is unstable and
  # signal when it is not -- and it means a comparison run at 2.0 penalises every
  # aggregation that spans more than one column.
  shrinkage: 100.0

  # Left out of the deviation but kept in the routing. These identify the
  # installation rather than describe a state that can go wrong: a large z on
  # `lat` means the object was routed to a cluster of other plants, which is a
  # routing fact, not a fault. Measured, including them cost about two thirds of
  # the score (AUC-PR 0.0120 against 0.0347).
  exclude_cols:
    - idsito
    - lat
    - lon
    - altitude
    - azimuth

selection:
  n_days: 10
  seed: 42
  metric: average_precision

  # Without the rolling window a grid point costs one fit, not one per scored
  # day, so the search is affordable in a way it was not before.
  #
  # Starting with r alone at its chosen value: the first run has to establish
  # that a fit on 162,000 objects completes in this machine's three gigabytes
  # before spending three times as long finding out. Widen to the commented
  # values once the timing is known.
  # scoring.shrinkage is the axis under test. At 2.0 against clusters of ~108
  # members the weight on a cluster's own variance is 108/110, i.e. the prior is
  # doing nothing -- and a single column whose cluster sigma came out spuriously
  # small yields a huge z, which is precisely what the maximum and the top-k
  # aggregations are dominated by. The global reference does not have this
  # problem because its sigma is estimated from 38,000 objects. If that is the
  # explanation, heavier shrinkage should lift the top-k variants specifically.
  grid:
    scoring.shrinkage: [2.0, 25.0, 100.0]
    # lsh.r: [7, 11, 15]
    # scoring.offset: [0.5, 1.0, 2.0]
    # scoring.scale: [0.5, 1.0, 2.0]
    # clustering.min_pts: [5, 10]

evaluation:
  # window_size and n_calibration_days no longer take part: the split is
  # chronological so a window protects against nothing, and there is no
  # calibration curve left to fit days for. Kept because the diagnostic scripts
  # under scripts/, which still run the regression protocol, read them.
  window_size: 30
  seeds: [42]
  n_calibration_days: 5

spark:
  master: local[*]
  driver_memory: 3g
  num_partitions: 8

mlflow:
  experiment_name: dencast-pv-italy-anomaly
  run_name_prefix: anomaly
